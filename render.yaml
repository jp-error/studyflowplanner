services:
  - type: web
    name: studyflow-account-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studyflow-db
          property: connectionString

databases:
  - name: studyflow-db
    databaseName: studyflow
    user: studyflow
    plan: free
